services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    environment:
      _JAVA_OPTIONS: "-Xmx768M"
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-change-this-password}

  phantom:
    build: .
    restart: unless-stopped
    depends_on:
      - lavalink
    env_file:
      - .env
    environment:
      LAVALINK_URI: ${LAVALINK_URI:-http://lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-change-this-password}
      LAVALINK_SECURE: ${LAVALINK_SECURE:-false}
      PHANTOM_DB_PATH: /app/data/phantom.db
    volumes:
      - ./data:/app/data
