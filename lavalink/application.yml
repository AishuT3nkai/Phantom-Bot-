server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "change-this-password"
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
  lavasrc:
    sources:
      spotify: true
      applemusic: true
      deezer: true
      tidal: true
      yandexmusic: true
    providers:
      - "ytsearch:%QUERY%"
      - "ytmsearch:%QUERY%"
      - "scsearch:%QUERY%"
      - "dzisrc:%QUERY%"

logging:
  level:
    root: INFO
    lavalink: INFO
