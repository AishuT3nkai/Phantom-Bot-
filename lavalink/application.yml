server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "change-this-password"
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
    - dependency: "com.dunctebot:skybot-lavalink-plugin:1.7.1"
      repository: "https://maven.lavalink.dev/releases"

plugins:
  lavasrc:
    sources:
      spotify: true
      applemusic: true
      deezer: true
      yandexmusic: true
      tidal: true
      qobuz: true
      vkmusic: true
      ytdlp: true
      jiosaavn: true
    providers:
      - "ytsearch:\"%ISRC%\""
      - "dzisrc:%ISRC%"
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "dzsearch:%QUERY%"
      - "scsearch:%QUERY%"
    lyrics-sources:
      spotify: true
      deezer: true
      youtube: true
      yandexmusic: true
      vkmusic: true
      lrcLib: true

  dunctebot:
    sources:
      getyarn: true
      clypit: true
      tts: false
      reddit: true
      ocremix: true
      tiktok: true
      mixcloud: true
      soundgasm: true
      pixeldrain: true
      tumblr: false

  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

  # Native Lavalink sources.
  # These cover SoundCloud, Bandcamp, Twitch, Vimeo, HTTP streams and other
  # sources supported by the installed Lavalink release.
