name: Validate Phantom music bot

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt PyYAML
      - run: python -m compileall -q .
      - run: python -c "import yaml, pathlib; yaml.safe_load(pathlib.Path('lavalink/application.yml').read_text())"
